[package]
name = "rfb_labs_week_6"
version = "0.1.0"
edition = "2024"

[dependencies]
bitcoin = { version = "0.32.0", features = ["rand-std", "serde"] }
bdk_wallet = { version = "1.0.0", features = ["rusqlite", "keys-bip39"] }
bdk_bitcoind_rpc = "0.22.0"
bitcoincore-rpc = "0.19.0"
clap = { version = "4.5", features = ["derive", "env"] }
dotenvy = "0.15"
thiserror = "2.0"
bip39 = "2.0"
rand = "0.8"
serde = { version = "1.0", features = ["derive"] }

[dev-dependencies]
tempfile = "3"
